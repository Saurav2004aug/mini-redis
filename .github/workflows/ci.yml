name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit + integration tests
        run: python -m unittest discover -s tests -v

  compatibility:
    name: Real Redis tools against mini-redis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install redis-cli and redis-benchmark
        run: sudo apt-get update && sudo apt-get install -y redis-tools
      - name: Start mini-redis
        run: |
          python -m miniredis --port 6379 --aof appendonly.aof > server.log 2>&1 &
          for i in $(seq 1 20); do redis-cli ping && break; sleep 0.5; done
      - name: redis-cli smoke test
        run: |
          test "$(redis-cli SET greeting hello)" = "OK"
          test "$(redis-cli GET greeting)" = "hello"
          test "$(redis-cli INCRBY hits 41)" = "41"
          redis-cli RPUSH queue a b c
          test "$(redis-cli LLEN queue)" = "3"
          redis-cli HSET user:1 name Aman
          test "$(redis-cli HGET user:1 name)" = "Aman"
      - name: redis-benchmark
        run: redis-benchmark -q -t set,get,incr,lpush -n 20000 -c 20
      - name: Persistence survives restart
        run: |
          pkill -TERM -f "^python -m miniredis"   # anchored so it cannot match this shell
          sleep 1
          python -m miniredis --port 6379 --aof appendonly.aof >> server.log 2>&1 &
          for i in $(seq 1 20); do redis-cli ping && break; sleep 0.5; done
          test "$(redis-cli GET greeting)" = "hello"
          test "$(redis-cli GET hits)" = "41"
      - name: Server log
        if: always()
        run: cat server.log
